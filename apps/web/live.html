<!doctype html>
<html lang="en" class="dark" data-theme="dark" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <title>Live analytics — App Health</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
      document.documentElement.dataset.mode = document.documentElement.dataset.theme;
      document.documentElement.classList.toggle(
        'dark',
        document.documentElement.dataset.theme !== 'light',
      );
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #111111;
        color: #f5f5f5;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: oklch(0.993 0 0);
        color: oklch(0.17 0.005 270);
      }
    </style>
  </head>
  <body>
    <div id="root" aria-busy="true">
      <div role="status" aria-label="Loading shared analytics" style="min-height: 24rem"></div>
    </div>
    <noscript>JavaScript is required to display live analytics.</noscript>
    <script type="module" src="/src/public-main.tsx"></script>
  </body>
</html>
