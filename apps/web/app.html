<!doctype html>
<html lang="en" class="dark" data-theme="dark" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>App Health dashboard</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('app-health-theme') === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
      document.documentElement.dataset.mode = document.documentElement.dataset.theme;
      document.documentElement.classList.toggle(
        'dark',
        document.documentElement.dataset.theme !== 'light',
      );
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #111111;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: oklch(0.993 0 0);
      }
      .dashboard-boot {
        min-height: 100vh;
        color: #f5f5f5;
        font:
          14px system-ui,
          sans-serif;
      }
      .dashboard-boot header {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        height: 64px;
        padding: 0 24px;
        border-bottom: 1px solid #303030;
      }
      .dashboard-boot a {
        color: inherit;
        text-decoration: none;
      }
      .dashboard-boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .dashboard-boot-brand svg {
        box-sizing: border-box;
        width: 32px;
        height: 32px;
        padding: 8px;
        border-radius: 6px;
        background: #f5f5f5;
        color: #171717;
      }
      .dashboard-boot-noscript {
        display: none;
        margin: 24px;
      }
      .dashboard-boot main {
        box-sizing: border-box;
        max-width: 1280px;
        margin: auto;
        padding: 24px;
      }
      .dashboard-boot p {
        margin: 0 0 16px;
        color: #a3a3a3;
      }
      .dashboard-boot-row {
        height: 48px;
        margin-top: 8px;
        border-radius: 6px;
        background: #262626;
      }
      html[data-theme='light'] .dashboard-boot {
        color: #171717;
      }
      html[data-theme='light'] .dashboard-boot header {
        border-color: #e5e5e5;
      }
      html[data-theme='light'] .dashboard-boot p {
        color: #525252;
      }
      html[data-theme='light'] .dashboard-boot-row {
        background: #e5e5e5;
      }
      html[data-theme='light'] .dashboard-boot-brand svg {
        background: #171717;
        color: #fafafa;
      }
      .dashboard-boot [data-dashboard-retry] {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-decoration: underline;
      }
      .dashboard-boot :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="dashboard-boot" data-initial-dashboard-shell>
        <header>
          <a class="dashboard-boot-brand" href="/" aria-label="App Health home">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M3 3v18h18M9 17V9m4 8V5m4 12v-4"></path>
            </svg>
            App Health
          </a>
        </header>
        <p class="dashboard-boot-noscript">JavaScript is required to open App Health.</p>
        <main aria-label="Loading workspace project" aria-busy="true">
          <p role="status">loading the workspace</p>
          <div class="dashboard-boot-row" aria-hidden="true"></div>
          <div class="dashboard-boot-row" aria-hidden="true"></div>
          <div class="dashboard-boot-row" aria-hidden="true"></div>
          <button type="button" data-dashboard-retry hidden>try again</button>
        </main>
      </div>
    </div>
    <noscript>
      <style>
        .dashboard-boot main {
          display: none;
        }
        .dashboard-boot .dashboard-boot-noscript {
          display: block;
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
