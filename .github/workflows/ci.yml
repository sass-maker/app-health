name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: Code health (TypeScript + Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app-health/web exec playwright install --with-deps chromium
      - run: pnpm run check

  go:
    name: Go (test, vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            packages/go/go.sum
            examples/go-echo/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Authenticate private Go module fetch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Verify tagged Echo release example
        working-directory: examples/go-echo
        env:
          GOPRIVATE: github.com/sarthakagrawal927/app-health
          GONOSUMDB: github.com/sarthakagrawal927/app-health
          GOPROXY: direct
        run: go test ./...
